<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760" role="img" aria-labelledby="title desc">
  <title id="title">关节反馈与任务反馈</title>
  <desc id="desc">任务目标进入决策模块，决策给关节控制器运动目标，控制器驱动机器人与物体。关节反馈返回控制器；图像和接触等观察经感知估计返回任务决策。</desc>
  <defs>
    <marker id="forward" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#29577f"/></marker>
    <marker id="inner" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#188476"/></marker>
    <marker id="outer" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#a56b2a"/></marker>
  </defs>
  <rect width="1260" height="760" rx="20" fill="#f5f7fb"/>
  <g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif" fill="#192d47">
    <text x="40" y="52" font-size="27" font-weight="700">图 1-2　关节跟上目标，物体也要发生预期变化</text>
    <text x="40" y="88" font-size="20" fill="#56667c">以下是职责示意。控制器、传感器和估计模块可以由多个设备与程序共同实现。</text>
    <g fill="#fff" stroke="#cbd7e5" stroke-width="2">
      <rect x="35" y="145" width="210" height="105" rx="12"/>
      <rect x="315" y="145" width="250" height="105" rx="12"/>
      <rect x="650" y="145" width="240" height="105" rx="12"/>
      <rect x="975" y="145" width="245" height="105" rx="12"/>
      <rect x="975" y="335" width="245" height="90" rx="12" fill="#e5f3ef" stroke="#92c2b6"/>
      <rect x="975" y="535" width="245" height="105" rx="12" fill="#faf0df" stroke="#d9bf91"/>
      <rect x="500" y="535" width="285" height="105" rx="12" fill="#faf0df" stroke="#d9bf91"/>
    </g>
    <g text-anchor="middle">
      <text x="140" y="187" font-size="23" font-weight="700">任务目标</text><text x="140" y="222" font-size="18">把物体放进盒子</text>
      <text x="440" y="187" font-size="23" font-weight="700">任务决策</text><text x="440" y="222" font-size="18">选择阶段与运动目标</text>
      <text x="770" y="187" font-size="23" font-weight="700">关节控制与驱动</text><text x="770" y="222" font-size="18">根据实测误差更新控制</text>
      <text x="1097" y="187" font-size="23" font-weight="700">机器人与物体</text><text x="1097" y="222" font-size="18">运动、负载、接触</text>
      <text x="1097" y="374" font-size="22" font-weight="700">关节测量</text><text x="1097" y="407" font-size="18">编码器等反馈</text>
      <text x="1097" y="578" font-size="22" font-weight="700">任务相关测量</text><text x="1097" y="613" font-size="18">图像、夹爪与接触信息</text>
      <text x="642" y="578" font-size="22" font-weight="700">感知与状态估计</text><text x="642" y="613" font-size="18">物体在哪里，是否随动</text>
    </g>
    <g fill="none" stroke="#29577f" stroke-width="3" marker-end="url(#forward)">
      <path d="M245 197H310"/><path d="M565 197H645"/><path d="M890 197H970"/>
    </g>
    <text x="584" y="175" font-size="17" fill="#29577f">目标</text>
    <text x="902" y="175" font-size="17" fill="#29577f">作用</text>
    <g fill="none" stroke="#188476" stroke-width="3" marker-end="url(#inner)">
      <path d="M1097 250V330"/><path d="M975 380H770V255"/>
    </g>
    <text x="793" y="359" font-size="19" fill="#188476">关节层反馈</text>
    <g fill="none" stroke="#a56b2a" stroke-width="3" marker-end="url(#outer)">
      <path d="M1220 220H1240V587H1225"/>
      <path d="M975 587H790"/>
      <path d="M500 587H440V255"/>
    </g>
    <text x="464" y="476" font-size="19" fill="#a56b2a">任务层反馈</text>
    <text x="50" y="695" font-size="20" fill="#188476">关节层：实际位置是否跟上目标？</text>
    <text x="640" y="695" font-size="20" fill="#a56b2a">任务层：目标物体是否被抓起并正确放置？</text>
  </g>
</svg>
