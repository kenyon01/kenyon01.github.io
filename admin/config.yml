# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.218.0/schema/sveltia-cms.json

backend:
  name: github
  repo: kenyon01/blog-private
  branch: main
  base_url: https://sveltia-cms-auth.1733128196.workers.dev

publish_mode: simple

site_url: https://kenyon01.github.io
display_url: https://kenyon01.github.io
logout_redirect_url: https://kenyon01.github.io
app_title: Qingyan 写作后台
logo:
  src: /assets/favicon.svg
  show_in_header: true

media_folder: /article-media
public_folder: /article-media

media_library:
  name: default
  config:
    max_file_size: 10485760

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"
  trim: true
  lowercase: true
  timezone: local

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: 新文章默认私有且未上架。私有文章仅在登录后台后阅读；只有已上架且公开的文章同步到博客。状态切换需等待网站更新。
    folder: /_posts
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - label: 页面布局
        name: layout
        widget: hidden
        default: post
      - label: 标题
        name: title
        widget: string
        hint: 文章的主标题，也是默认文件名的一部分。
      - label: 摘要
        name: description
        widget: text
        hint: 用一两句话说明文章内容，会显示在文章列表和搜索结果中。
      - label: 所属栏目
        name: topic
        widget: relation
        default: general
        collection: topics
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        hint: 选择文章所属栏目，决定顶部导航中的归属；左侧目录只展示这个栏目内的章节和文章。也可点击「添加栏目」新建。
      - label: 所属章节
        name: chapter
        widget: relation
        required: false
        collection: chapters
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        filters:
          - field: topic
            values: ['{{fields.topic}}']
        hint: 先选择栏目，再选择已创建的章节。选项显示完整层级；留空则直接放在栏目目录下。章节可在左侧「章节管理」单独创建。
      - label: 文章顺序
        name: chapter_order
        widget: number
        value_type: int
        default: 50
        min: 1
        max: 10000
        hint: 同一章节内数字越小越靠前。章节之间的顺序请在「章节管理」设置。
      - label: 发布日期
        name: date
        widget: datetime
        type: date
        default: "{{now}}"
      - label: 网站可见
        name: published
        widget: hidden
        default: false
      - label: 阅读权限
        name: visibility
        widget: select
        default: private
        options:
          - {label: 私有（仅站主后台可读）, value: private}
          - {label: 公开（上架后所有人可读）, value: public}
        hint: 私有正文和新上传图片保存在私有仓库。曾公开的内容可能仍存在于公开历史记录中。
      - label: 标签
        name: tags
        widget: list
        required: false
        hint: 补充文章主题，例如：策略与控制、训练数据、实验方法。所属栏目请在上方单独选择。
        field:
          label: 标签
          name: tag
          widget: string
      - label: 预计阅读时间
        name: reading_time
        widget: number
        value_type: int
        min: 1
        max: 60
        default: 5
        hint: 单位为分钟。
      - label: 实验视频
        name: videos
        widget: list
        required: false
        summary: "{{fields.caption}}"
        hint: 添加一项后上传视频。视频保存到腾讯云，仅链接进入 GitHub；视频链接可公开访问。
        fields:
          - label: 视频说明
            name: caption
            widget: string
          - label: 腾讯云视频链接
            name: video_url
            widget: string
            pattern: ['^https://www\.nlearn\.net/robot-media/videos/[a-f0-9]{64}\.mp4$', '请上传到腾讯云或选择已上传的视频。']
      - label: 正文
        name: body
        widget: richtext
        hint: 支持 Markdown、代码块、链接和图片。
  - name: topics
    label: 栏目管理
    label_singular: 栏目
    description: 新建或修改栏目，保存后名称和简介会公开发布。文章编辑页可选择这里的所有栏目。栏目不支持删除，可关闭导航显示。
    folder: /_topics
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields:
      fields: [order, title]
      default:
        field: order
        direction: ascending
    fields:
      - label: 栏目名称
        name: title
        widget: string
        maxlength: 80
        hint: 例如：数字信号处理。新栏目会自动生成独立页面。
      - label: 栏目简介
        name: description
        widget: text
        required: false
        maxlength: 2000
      - label: 导航顺序
        name: order
        widget: number
        value_type: int
        default: 50
        min: 1
        max: 1000
        hint: 数字越小越靠前。
      - label: 显示在主导航
        name: show_in_nav
        widget: boolean
        default: true
        hint: 关闭后仍可在文章中选择该栏目，栏目页面也仍可访问。
  - name: chapters
    label: 章节管理
    label_singular: 章节
    description: 先选栏目，再填写章节名称和上级章节。留空上级章节表示第一层。名称和层级会公开显示在该栏目的目录中；修改章节会自动更新文章的目录位置。
    folder: /_chapters
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{topic}} · {{title}}"
    sortable_fields:
      fields: [order, title]
      default:
        field: order
        direction: ascending
    fields:
      - label: 所属栏目
        name: topic
        widget: relation
        collection: topics
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
      - label: 章节名称
        name: title
        widget: string
        maxlength: 80
        hint: 例如：第一章 基础知识、1.1 接口。相同上级下的名称不能重复。
      - label: 上级章节
        name: parent
        widget: relation
        required: false
        collection: chapters
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        filters:
          - field: topic
            values: ['{{fields.topic}}']
          - field: slug
            values: ['{{slug}}']
            exclude: true
        hint: 留空表示本栏目第一层。可选同一栏目内的已有章节，最多支持 8 层。
      - label: 章节顺序
        name: order
        widget: number
        value_type: int
        default: 50
        min: 1
        max: 10000
        hint: 同一层内数字越小越靠前。
