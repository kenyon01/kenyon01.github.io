# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.218.0/schema/sveltia-cms.json

backend:
  name: github
  repo: kenyon01/kenyon01.github.io
  branch: main
  base_url: https://sveltia-cms-auth.1733128196.workers.dev

publish_mode: simple

site_url: https://kenyon01.github.io
display_url: https://kenyon01.github.io
logout_redirect_url: https://kenyon01.github.io
app_title: Qingyan 写作后台
logo:
  src: /assets/favicon.svg
  show_in_header: true

media_folder: /assets/uploads
public_folder: /assets/uploads

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"
  trim: true
  lowercase: true
  timezone: local

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: 新文章保存后为未上架。在列表点击上架后公开，点击下架可隐藏。已上架文章的编辑保存会更新网站。
    folder: /_posts
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - label: 页面布局
        name: layout
        widget: hidden
        default: post
      - label: 标题
        name: title
        widget: string
        hint: 文章的主标题，也是默认文件名的一部分。
      - label: 摘要
        name: description
        widget: text
        hint: 用一两句话说明文章内容，会显示在文章列表和搜索结果中。
      - label: 发布日期
        name: date
        widget: datetime
        type: date
        default: "{{now}}"
      - label: 网站可见
        name: published
        widget: hidden
        default: false
      - label: 标签
        name: tags
        widget: list
        required: false
        hint: 例如：量化、AI、工程实践。
        field:
          label: 标签
          name: tag
          widget: string
      - label: 预计阅读时间
        name: reading_time
        widget: number
        value_type: int
        min: 1
        max: 60
        default: 5
        hint: 单位为分钟。
      - label: 正文
        name: body
        widget: richtext
        hint: 支持 Markdown、代码块、链接和图片。
