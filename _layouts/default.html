<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fafafa">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v=topic-scope-1">
    <script defer src="{{ '/assets/js/main.js' | relative_url }}?v=reader-1"></script>
    {% if page.html_report_url %}<script type="module" src="{{ '/assets/js/report-embed.mjs' | relative_url }}?v=1"></script>{% endif %}
    {% if page.layout == 'post' or page.layout == 'topic' or page.layout == 'robotics' %}
    <link rel="stylesheet" href="{{ '/assets/css/knowledge.css' | relative_url }}?v=topic-scope-1">
    <script type="module" src="{{ '/assets/js/knowledge.mjs' | relative_url }}?v=managed-chapters-1"></script>
    {% endif %}
    {% if page.url == '/robotics/' %}
    <link rel="stylesheet" href="{{ '/assets/css/robotics.css' | relative_url }}?v=1">
    <script defer src="{{ '/assets/js/robotics.js' | relative_url }}?v=1"></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    {% include header.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
  </body>
</html>
