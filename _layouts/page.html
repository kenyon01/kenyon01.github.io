---
layout: default
---
<article class="page shell">
  <header class="page-header reveal">
    <p class="eyebrow">{{ page.kicker | default: 'QINGYAN / NOTES' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="page-content reveal">{{ content }}</div>
</article>
